name: publish
on:
  schedule:
    - cron: "0 7 * * *"     # 12:30 IST, slot a
    - cron: "30 13 * * *"   # 19:00 IST, slot b
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = check only, do not post"
        default: "0"
permissions:
  contents: write
concurrency: publish
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish next due post
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
        run: python3 scripts/publish.py
      - name: Record result
        if: always()
        run: |
          git config user.name "seedha-bot"
          git config user.email "seedha-bot@users.noreply.github.com"
          git add queue
          git diff --cached --quiet || (git commit -m "published $(date -u +%F)" && git push)
