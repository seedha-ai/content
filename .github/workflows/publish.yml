name: publish
on:
  schedule:
    # GitHub delays or skips scheduled runs, so check every 30 min (12:07 PM to 10:37 PM IST).
    # publish.py posts only when a slot is due (a: 12:00 IST, b: 18:30 IST), one post per run.
    - cron: "7,37 6-17 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = check only, do not post"
        default: "0"
permissions:
  contents: write
concurrency: publish
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish next due post
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
        run: python3 scripts/publish.py
      - name: Record result
        if: always()
        run: |
          git config user.name "seedha-bot"
          git config user.email "seedha-bot@users.noreply.github.com"
          git add queue
          git diff --cached --quiet || (git commit -m "published $(date -u +%F)" && git push)
