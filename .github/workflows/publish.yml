name: publish
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = check only, do not post"
        default: "0"
      mode:
        description: "loop (stay alive and post on time) | once | metrics"
        default: "loop"
  schedule:
    # Only a restart in case the self-running loop ever stops. Posting timing does not rely on this.
    - cron: "11 */3 * * *"
permissions:
  contents: write
  actions: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Publisher (prepares 60 min early, posts on the minute, saves metrics 8:30 PM IST)
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          MODE: ${{ github.event.inputs.mode || 'loop' }}
          BUDGET_MIN: "330"
        run: |
          git config user.name "seedha-bot"
          git config user.email "seedha-bot@users.noreply.github.com"
          python3 scripts/publish.py
      - name: Start the next run
        if: always() && (github.event.inputs.mode || 'loop') == 'loop' && (github.event.inputs.dry_run || '0') != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sf -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/publish.yml/dispatches" \
            -d '{"ref":"main","inputs":{"dry_run":"0","mode":"loop"}}' && echo "next run started"
